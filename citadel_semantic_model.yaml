verified_queries:
  - name: fraud_flags_this_week
    question: Which accounts show fraud-risk patterns this week?
    sql: |
      SELECT
        t.account_id,
        a.account_type,
        c.segment,
        COUNT(*) AS flagged_txn_count,
        SUM(t.amount) AS total_flagged_amount,
        MAX(t.flag_score) AS max_flag_score,
        ARRAY_AGG(DISTINCT t.fraud_pattern) AS patterns
      FROM CITADEL_DB.RISK.TRANSACTIONS t
      JOIN CITADEL_DB.RISK.ACCOUNTS a ON a.account_id = t.account_id
      JOIN CITADEL_DB.RISK.CUSTOMERS c ON c.customer_id = a.customer_id
      WHERE t.is_flagged = TRUE
        AND t.txn_ts >= DATEADD(day, -7, CURRENT_TIMESTAMP())
      GROUP BY t.account_id, a.account_type, c.segment
      ORDER BY max_flag_score DESC
      LIMIT 20

  - name: lcr_trend_30_days
    question: What is the LCR trend over the last 30 days?
    sql: |
      SELECT
        position_date,
        ROUND(AVG(lcr_ratio) * 100, 1) AS avg_lcr_pct,
        MAX(CASE WHEN lcr_breach THEN 1 ELSE 0 END) AS had_breach
      FROM CITADEL_DB.RISK.LIQUIDITY_POSITIONS
      WHERE position_date >= DATEADD(day, -30, CURRENT_DATE)
        AND tenor_bucket = '0_7D'
      GROUP BY position_date
      ORDER BY position_date

  - name: credit_watch_list_by_sector
    question: Show me the credit watch-list broken down by sector
    sql: |
      SELECT
        e.sector,
        COUNT(*) AS watch_list_count,
        ROUND(SUM(e.outstanding) / 1e6, 2) AS outstanding_millions,
        ROUND(SUM(e.rwa) / 1e6, 2) AS rwa_millions,
        ROUND(AVG(e.pd_score) * 100, 2) AS avg_pd_pct,
        ROUND(SUM(e.expected_loss) / 1e6, 4) AS ecl_millions
      FROM CITADEL_DB.RISK.CREDIT_EXPOSURES e
      WHERE e.watch_list_flag = TRUE
      GROUP BY e.sector
      ORDER BY outstanding_millions DESC

  - name: high_risk_customers_with_fraud_flags
    question: Which high-risk customers have open fraud flags this week?
    sql: |
      SELECT
        c.customer_id,
        c.segment,
        c.risk_rating,
        c.pep_flag,
        c.sanction_flag,
        COUNT(DISTINCT t.txn_id) AS flagged_txn_count,
        MAX(t.flag_score) AS max_fraud_score,
        ARRAY_AGG(DISTINCT t.fraud_pattern) AS fraud_patterns
      FROM CITADEL_DB.RISK.CUSTOMERS c
      JOIN CITADEL_DB.RISK.ACCOUNTS a ON a.customer_id = c.customer_id
      JOIN CITADEL_DB.RISK.TRANSACTIONS t ON t.account_id = a.account_id
      WHERE c.risk_rating = 'HIGH'
        AND t.is_flagged = TRUE
        AND t.txn_ts >= DATEADD(day, -7, CURRENT_TIMESTAMP())
      GROUP BY c.customer_id, c.segment, c.risk_rating, c.pep_flag, c.sanction_flag
      ORDER BY max_fraud_score DESC
      LIMIT 20

  - name: open_risk_flags_summary
    question: Give me a summary of open risk flags by domain and severity
    sql: |
      SELECT
        flag_domain,
        severity,
        flag_type,
        COUNT(*) AS flag_count,
        ROUND(AVG(flag_score), 1) AS avg_score
      FROM CITADEL_DB.RISK.RISK_FLAGS
      WHERE flag_status = 'OPEN'
      GROUP BY flag_domain, severity, flag_type
      ORDER BY
        CASE severity WHEN 'CRITICAL' THEN 1 WHEN 'HIGH' THEN 2 WHEN 'MEDIUM' THEN 3 ELSE 4 END,
        flag_count DESC

  - name: structuring_pattern_detail
    question: Show me structuring transactions and the customers behind them
    sql: |
      SELECT
        t.txn_id,
        t.account_id,
        c.customer_id,
        c.segment,
        c.pep_flag,
        t.amount,
        t.channel,
        t.txn_ts,
        t.flag_score,
        t.country_code
      FROM CITADEL_DB.RISK.TRANSACTIONS t
      JOIN CITADEL_DB.RISK.ACCOUNTS a ON a.account_id = t.account_id
      JOIN CITADEL_DB.RISK.CUSTOMERS c ON c.customer_id = a.customer_id
      WHERE t.fraud_pattern = 'STRUCTURING'
      ORDER BY t.txn_ts DESC
      LIMIT 50

  - name: total_rwa_by_sector_and_rating
    question: What is the total RWA exposure by sector and internal rating?
    sql: |
      SELECT
        sector,
        internal_rating,
        COUNT(*) AS facility_count,
        ROUND(SUM(outstanding) / 1e6, 2) AS outstanding_millions,
        ROUND(SUM(rwa) / 1e6, 2) AS rwa_millions,
        ROUND(AVG(pd_score) * 100, 2) AS avg_pd_pct
      FROM CITADEL_DB.RISK.CREDIT_EXPOSURES
      GROUP BY sector, internal_rating
      ORDER BY rwa_millions DESC
      LIMIT 30

  - name: liquidity_breach_detail
    question: Show me the days where LCR was below 100 percent with details
    sql: |
      SELECT
        position_date,
        tenor_bucket,
        ROUND(lcr_ratio * 100, 1) AS lcr_pct,
        ROUND(lcr_numerator / 1e6, 1) AS hqla_millions,
        ROUND(lcr_denominator / 1e6, 1) AS net_outflow_millions,
        nsfr_breach
      FROM CITADEL_DB.RISK.LIQUIDITY_POSITIONS
      WHERE lcr_breach = TRUE
      ORDER BY position_date DESC, lcr_ratio ASC
      LIMIT 50

custom_instructions: >
  When answering fraud questions, always include the fraud_pattern dimension and flag_score
  to explain the signal, and cite the regulatory basis from threshold_rationale when available.

  When answering credit risk questions, always note that PD > 0.15 is the watch-list threshold
  (Basel III ICAAP internal calibration equivalent to BB-/B+ or below).

  When answering liquidity questions, always include the lcr_ratio value and note that < 1.0
  (below 100%) is a Basel III Art. 412 breach requiring supervisory notification.

  For AML queries, always check whether the customer is a PEP (Politically Exposed Person),
  as PEP status triggers FATF Recommendation 12 enhanced due diligence requirements.

  Flag score interpretation for all domains: 0-40 = low risk, 41-65 = medium risk,
  66-100 = high risk (internal calibration).

  When citing regulations, use these standard references:
  - LCR minimum: Basel III Art. 412 / BCBS January 2013
  - NSFR minimum: Basel III Art. 428b
  - Structuring: 31 CFR 1010.314 (BSA/FinCEN) and PMLA Schedule Rule 3(B)
  - Cross-border: FATF Recommendation 19
  - PEP: FATF Recommendation 12
  - NPA classification: RBI Master Circular on IRAC 2023
  - Credit watch-list: Basel III ICAAP internal threshold (PD > 0.15)
